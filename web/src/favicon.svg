<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    BuddyCron 的图标：一枚朱红印章。

    为什么是这个：整个界面就是「签到簿 + 每天盖一个章」，图标应该直接画那个
    动作本身，而不是一个抽象的字母或齿轮。32×32 下能辨认的只有形状和色块，
    所以用「圆角方块 + 内部的勾」——远看是一枚章，近看是一个对勾。

    **不加底色**：之前铺了一层深色纸底，结果在浅色标签栏上看起来就是一圈黑边。
    朱红本身在浅色和深色标签栏上都够醒目，不需要衬底。
  -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#c8442c"/>
  <!-- 对勾。用折线而不是字符：字体不同渲染差异太大 -->
  <path d="M9.5 16.2 L14.2 20.9 L22.5 11.8"
        fill="none" stroke="#fff6f2" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
