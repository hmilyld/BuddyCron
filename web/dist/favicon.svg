<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    BuddyCron 的图标：一枚盖在纸上的朱红印章。

    为什么是这个：整个界面就是「签到簿 + 每天盖一个章」，图标应该直接画那个
    动作本身，而不是一个抽象的字母或齿轮。32×32 下能辨认的只有形状和色块，
    所以用「圆角方块 + 内部的勾」——远看是一枚章，近看是一个对勾。

    底色用纸面深色而不是透明：浏览器标签栏有浅色和深色两种，透明背景会让
    深色印章在深色标签栏上消失。给它自己的底，两种主题下都稳定。
  -->
  <rect width="32" height="32" rx="7" fill="#14120f"/>
  <!-- 印章本体：稍微内缩，留出纸边 -->
  <rect x="6" y="6" width="20" height="20" rx="3" fill="#c8442c"/>
  <!-- 对勾。用折线而不是字符：字体不同渲染差异太大 -->
  <path d="M11.5 16.5 L14.8 19.8 L20.5 13.2"
        fill="none" stroke="#fff6f2" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
