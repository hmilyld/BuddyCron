name: release

# 打 tag 才发布：分支推送不该产出对外镜像。
# 手动触发（workflow_dispatch）需要工作流文件已在默认分支上。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write   # 建 Release
  packages: write   # 推 ghcr.io

env:
  # Docker 镜像名必须全小写，而 github.repository 保留了仓库名的大小写
  # （hmilyld/BuddyCron）。直接用它会让 `docker pull` 失败 —— 推上去的
  # 是 buddycron，Release 里写的却是 BuddyCron。
  IMAGE: ghcr.io/${{ github.repository_owner }}/buddycron

jobs:
  # ---------------------------------------------------------------- 先验证
  # 版本号不一致、测试不过，就不该产出镜像 —— 一个标错版本号的镜像
  # 比没有镜像更麻烦：你无法从 tag 判断里面到底是什么代码。
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 校验 tag 与代码里的版本号一致
        id: check
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(python3 -c "import sys; sys.path.insert(0,'.'); from core.version import VERSION; print(VERSION)")
          echo "tag=$TAG  code=$VERSION"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 core/version.py 里的版本 (v$VERSION) 不一致。"
            echo "先改 core/version.py 再重新打 tag。"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 校验 CHANGELOG 有对应段落
        run: |
          # 没有段落就不该发布 —— Release 正文会是空的，读者看不出这个版本
          # 改了什么。这一步在构建镜像之前，失败就不产出任何产物。
          VERSION="${{ steps.check.outputs.version }}"
          if ! python3 scripts/changelog.py "$VERSION" > /dev/null; then
            echo "::error::CHANGELOG.md 缺少 [$VERSION] 段落。先补 CHANGELOG 再打 tag。"
            exit 1
          fi
          echo "CHANGELOG 段落已就绪"

      - name: 跑测试
        run: python3 -m unittest discover -s tests -v

      - name: 确认界面产物已提交
        run: |
          # web/dist 是编译产物，必须跟着源码一起提交 —— 否则镜像里没有界面。
          for f in web/dist/index.html web/dist/login.html web/dist/app.css; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f，先跑 python3 web/build.py 并提交"
              exit 1
            fi
          done

  # ---------------------------------------------------------------- 建镜像
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 语义化 tag 同时产出三个标签：完整版本、次版本、latest。
          # 这样用户既能精确锁定，也能直接拉 latest。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=BuddyCron
            org.opencontainers.image.description=WorkBuddy 多账号签到与积分工具
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 + arm64：服务器可能是 Apple Silicon 或 ARM 云主机。
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 把版本号烘进镜像，容器内 cli.py version 能读到真实来源。
          build-args: |
            BUDDYCRON_VERSION=${{ needs.verify.outputs.version }}

  # ---------------------------------------------------------------- 建 Release
  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 生成 Release 正文
        id: notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # 上半：这个版本改了什么（来自 CHANGELOG，人话）
          # 下半：怎么部署（固定内容，不用每次改）
          {
            echo "## 变更"
            echo
            python3 scripts/changelog.py "$VERSION"
            echo
            echo "## 镜像"
            echo
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:$VERSION"
            echo '```'
            echo
            echo "或直接："
            echo
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:latest"
            echo '```'
            echo
            echo "支持 amd64 与 arm64。"
            echo
            echo "## 快速开始"
            echo
            echo '```bash'
            echo "mkdir -p data"
            echo "docker compose up -d"
            echo "docker compose logs -f buddycron   # 首次会打印登录密码"
            echo '```'
            echo
            echo "浏览器打开 \`http://127.0.0.1:8787/\`，用打印出来的密码登录，"
            echo "点「添加账号」逐个授权。"
            echo
            echo "数据都在 \`./data\`，更新版本时 \`docker compose up -d --build\` 不会丢账号。"
            echo
            echo "## 说明"
            echo
            echo "非官方工具，与 WorkBuddy / CodeBuddy 无关联。接口从官方前端逆向所得，"
            echo "服务端改版可能失效。仅用于管理你自己名下的账号。"
          } > /tmp/release-notes.md
          echo "正文已生成，$(wc -l < /tmp/release-notes.md) 行"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: BuddyCron ${{ needs.verify.outputs.tag }}
          # 不用 generate_release_notes：它按 commit 列表生成，读者看到的是
          # 「fix(ci): ...」这种开发者视角的碎片，而不是「这个版本带来了什么」。
          body_path: /tmp/release-notes.md
